<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Joint Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="controls">
        <button id="connect-button">Connect HID Device</button>
        <button id="disconnect-button" disabled style="display: none;">Disconnect All</button>
        <span id="status-indicator" class="status disconnected">Status: Disconnected</span>
    </div>
    
    <div class="container">
        <div id="canvas-container">
            <!-- 3D canvas will be inserted here -->
            <div class="view-controls">
                <button class="view-button" id="front-view-btn">Front</button>
                <button class="view-button" id="side-view-btn">Side</button>
                <button class="view-button" id="top-view-btn">Top</button>
                <button class="view-button" id="reset-view-btn">Reset</button>
            </div>
        </div>
        
        <div id="sidebar">
            <div class="sidebar-box">
                <div class="sidebar-header">
                    <div class="sidebar-name">Arm Angles</div>
                </div>
                <div id="arm-values">
                    <div class="value-row">
                        <span>Wrist Flexion:</span>
                        <span id="wrist-flexion">0.0°</span>
                    </div>
                    <div class="value-row">
                        <span>Wrist Deviation:</span>
                        <span id="wrist-deviation">0.0°</span>
                    </div>
                    <div class="value-row">
                        <span>Wrist Rotation:</span>
                        <span id="wrist-rotation">0.0°</span>
                    </div>
                    <div class="value-row">
                        <span>Elbow Flexion:</span>
                        <span id="elbow-flexion">0.0°</span>
                    </div>
                    <div class="value-row">
                        <span>Shoulder Flexion:</span>
                        <span id="shoulder-flexion">0.0°</span>
                    </div>
                    <div class="value-row">
                        <span>Shoulder Deviation:</span>
                        <span id="shoulder-deviation">0.0°</span>
                    </div>
                </div>
            </div>

            <div id="joints-container">
                <!-- Joint info will be added here -->
            </div>
            
            <div class="log-container" id="log-container">
                <!-- Log messages will be added here -->
            </div>

        </div>
    </div>
    
    <!-- Import Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
