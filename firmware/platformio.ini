; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
lib_deps = 
    dxinteractive/ResponsiveAnalogRead@^1.2.1
    h2zero/NimBLE-Arduino@^2.3.1
    adafruit/Adafruit BNO08x@^1.2.3
monitor_speed = 115200
debug_tool = esp-builtin
debug_load_mode = manual
build_type = debug
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE Configuration
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_CONTROLLER_ENABLED=0
    -DCONFIG_BT_CONTROLLER_ONLY=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -DCONFIG_BT_NIMBLE_NVS_PERSIST=1
    -DCONFIG_BT_NIMBLE_SECURITY=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=8
    -DCONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=0
    -DCONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
    -DCONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=0
    -DCONFIG_BTDM_CTRL_MODE_BTDM=0
    -DCONFIG_BTDM_MODEM_SLEEP=0
    -DCONFIG_BTDM_BLE_SLEEP_CLOCK_ACCURACY_INDEX_EFF=1
    -DCONFIG_BT_CTRL_MODE_BLE_ONLY=1
    -DCONFIG_BT_BLUEDROID_ENABLED=0
    -DCONFIG_BT_CLASSIC_ENABLED=0
    ; Force exclude the built-in BT library
    -Wl,--exclude-libs=libbt.a
    -Wl,--allow-multiple-definition
lib_ignore =
    BluetoothSerial
    ESP32 BLE Arduino
build_src_filter = 
    +<*> 
    -<*/bt/*>
    -<*/esp32-bt/*>
    -<*/bluedroid/*>